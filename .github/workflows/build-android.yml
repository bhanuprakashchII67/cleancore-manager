name: Build CleanCore Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cleancore-manager-android-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Validate JavaScript and UI wiring
        run: |
          node --check app.js
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html','utf8');
          const js = fs.readFileSync('app.js','utf8');
          const version = js.match(/MANAGER_VERSION="([^"]+)"/)?.[1];
          const asset = html.match(/app\.js\?v=([^"' ]+)/)?.[1];
          if (!version) throw new Error('MANAGER_VERSION is missing.');
          if (asset !== version) throw new Error(`index.html app.js asset version ${asset} does not match Manager version ${version}`);
          if (!js.includes('bindAppUpdateControls();')) throw new Error('Update button binding is not initialized.');
          const viewerIds = ['invoiceDialog','quotationDialog','printInvoice','printQuotation','closeInvoice','closeQuotation','updateApp'];
          for (const id of viewerIds) {
            if (!html.includes(`id="${id}"`) || !js.includes(id)) throw new Error(`Missing viewer/updater wiring for ${id}`);
          }
          if (/<div id="invoiceDialog"[^>]*class="[^"]*invoice-viewer-panel/.test(html) && /invoiceDialog\.showModal\(\)/.test(js)) {
            throw new Error('Invoice viewer must not use showModal().');
          }
          if (/<div id="quotationDialog"[^>]*class="[^"]*quotation-viewer-panel/.test(html) && /quotationDialog\.showModal\(\)/.test(js)) {
            throw new Error('Quotation viewer must not use showModal().');
          }
          console.log(`UI wiring check passed for Manager v${version}`);
          NODE

      - name: Prepare web assets for Capacitor
        run: |
          mkdir -p www
          cp index.html app.js app-*.js style.css logo.svg icon-*.svg manifest.webmanifest sw.js www/

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare app launcher icon
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -rf android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          npm install --no-save sharp
          node - <<'NODE'
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');
          const sizes = { mdpi: 48, hdpi: 72, xhdpi: 96, xxhdpi: 144, xxxhdpi: 192 };
          (async () => {
            for (const [density, size] of Object.entries(sizes)) {
              const dir = path.join('android/app/src/main/res', 'mipmap-' + density);
              fs.mkdirSync(dir, { recursive: true });
              await sharp('logo.svg').resize(size, size, {fit:'cover'}).png().toFile(path.join(dir, 'ic_launcher.png'));
              await sharp('logo.svg').resize(size, size, {fit:'cover'}).png().toFile(path.join(dir, 'ic_launcher_round.png'));
            }
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Configure native APK installer
        shell: bash
        run: |
          PKG_DIR="android/app/src/main/java/com/cleancore/businessmanager"
          RES_DIR="android/app/src/main/res/xml"
          mkdir -p "$PKG_DIR" "$RES_DIR"
          cat > "$PKG_DIR/ApkInstallerPlugin.java" <<'JAVA'
          package com.cleancore.businessmanager;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;

          @CapacitorPlugin(name = "ApkInstaller")
          public class ApkInstallerPlugin extends Plugin {
            @PluginMethod
            public void installApk(PluginCall call) {
              String relativePath = call.getString("path", "");
              if (relativePath == null || relativePath.trim().isEmpty() || relativePath.contains("..") || relativePath.startsWith("/")) {
                call.reject("Invalid APK path.");
                return;
              }

              File baseDir = getContext().getFilesDir();
              File apkFile = new File(baseDir, relativePath);
              try {
                String base = baseDir.getCanonicalPath() + File.separator;
                String apk = apkFile.getCanonicalPath();
                if (!apk.startsWith(base) || !apkFile.isFile() || apkFile.length() < 100000) {
                  call.reject("Downloaded APK is missing or incomplete.");
                  return;
                }

                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O &&
                    !getContext().getPackageManager().canRequestPackageInstalls()) {
                  Intent settingsIntent = new Intent(
                      Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                      Uri.parse("package:" + getContext().getPackageName()));
                  settingsIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  getActivity().startActivity(settingsIntent);
                  call.reject("INSTALL_PERMISSION_REQUIRED");
                  return;
                }

                Uri apkUri = FileProvider.getUriForFile(
                    getContext(),
                    getContext().getPackageName() + ".fileprovider",
                    apkFile);

                Intent intent = new Intent(Intent.ACTION_INSTALL_PACKAGE);
                intent.setDataAndType(apkUri, "application/vnd.android.package-archive");
                intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                getActivity().startActivity(intent);
                call.resolve();
              } catch (Exception e) {
                call.reject(e.getMessage() == null ? "Unable to open Android package installer." : e.getMessage(), e);
              }
            }
          }
          JAVA

          cat > "$RES_DIR/file_paths.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
            <files-path name="files" path="." />
            <cache-path name="cache" path="." />
          </paths>
          XML

          MAIN_ACTIVITY=$(find android/app/src/main/java -name 'MainActivity.java' -o -name 'MainActivity.kt' | head -1)
          if [[ -z "$MAIN_ACTIVITY" ]]; then
            echo "MainActivity not found" >&2
            exit 1
          fi
          if [[ "$MAIN_ACTIVITY" == *.java ]]; then
            python3 - "$MAIN_ACTIVITY" <<'PY'
          import pathlib,re,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text()
          if "ApkInstallerPlugin" not in s:
              s=s.replace("import com.getcapacitor.BridgeActivity;", "import android.os.Bundle;\nimport com.getcapacitor.BridgeActivity;\nimport com.cleancore.businessmanager.ApkInstallerPlugin;")
              s=re.sub(r'public class MainActivity extends BridgeActivity\s*\{\s*\}', '''public class MainActivity extends BridgeActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              registerPlugin(ApkInstallerPlugin.class);
            }
          }''', s)
              p.write_text(s)
          PY
          else
            echo "Unexpected Kotlin MainActivity; native installer registration needs Kotlin support." >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          perm='<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />'
          if perm not in s:
              s=s.replace('</manifest>',f'  {perm}\n</manifest>')
              p.write_text(s)
          PY

      - name: Set Android version
        run: |
          VERSION=$(node -e 'const fs=require("fs");const s=fs.readFileSync("app.js","utf8");console.log(s.match(/MANAGER_VERSION="([^"]+)"/)[1])')
          CODE=$(node -e 'const v=process.argv[1].split(".").map(Number);console.log(v[0]*10000+v[1]*100+v[2])' "$VERSION")
          python3 - "$VERSION" "$CODE" <<'PY'
          import sys,re
          version,code=sys.argv[1],sys.argv[2]
          p="android/app/build.gradle"
          s=open(p).read()
          s=re.sub(r'versionCode\s+\d+',f'versionCode {code}',s,count=1)
          s=re.sub(r'versionName\s+"[^"]+"',f'versionName "{version}"',s,count=1)
          open(p,"w").write(s)
          PY

      - name: Configure stable app signing
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: '${{ secrets.CLEANCORE_ANDROID_KEYSTORE_BASE64 }}'
          KEYSTORE_PASSWORD: '${{ secrets.CLEANCORE_ANDROID_KEYSTORE_PASSWORD }}'
          KEY_ALIAS: '${{ secrets.CLEANCORE_ANDROID_KEY_ALIAS }}'
          KEY_PASSWORD: '${{ secrets.CLEANCORE_ANDROID_KEY_PASSWORD }}'
        run: |
          if [[ -z "$KEYSTORE_B64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "stable_signing=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Stable Android signing secrets are not configured. This build will remain debug-signed; in-place APK updates are not reliable."
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/cleancore-release.jks"
          echo "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "CLEANCORE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "CLEANCORE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CLEANCORE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "CLEANCORE_ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/build.gradle")
          s=p.read_text()
          if "signingConfigs {" not in s:
              s=s.replace("buildTypes {", "signingConfigs {\n        release {\n          storeFile file(System.getenv('CLEANCORE_KEYSTORE_PATH'))\n          storePassword System.getenv('CLEANCORE_KEYSTORE_PASSWORD')\n          keyAlias System.getenv('CLEANCORE_KEY_ALIAS')\n          keyPassword System.getenv('CLEANCORE_ANDROID_KEY_PASSWORD')\n        }\n      }\n\n      buildTypes {")
          s=s.replace("release {\n        minifyEnabled false", "release {\n        signingConfig signingConfigs.release\n        minifyEnabled false", 1)
          p.write_text(s)
          PY
          echo "stable_signing=true" >> "$GITHUB_OUTPUT"

      - name: Build Android APK
        run: |
          if [[ "${{ steps.signing.outputs.stable_signing }}" == "true" ]]; then
            cd android && ./gradlew assembleRelease
          else
            cd android && ./gradlew assembleDebug
          fi

      - name: Verify APK signature
        shell: bash
        run: |
          if [[ "${{ steps.signing.outputs.stable_signing }}" == "true" ]]; then
            APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          else
            APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          test -s "$APK_PATH"
          echo "APK: $APK_PATH"
          keytool -printcert -jarfile "$APK_PATH" | grep -E 'Owner:|SHA256:' || true

      - name: Publish latest release
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: |
          VERSION=$(node -e 'const fs=require("fs");const s=fs.readFileSync("app.js","utf8");console.log(s.match(/MANAGER_VERSION="([^"]+)"/)[1])')
          TAG="v$VERSION"
          if [[ "${{ steps.signing.outputs.stable_signing }}" == "true" ]]; then
            APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
            SIGNED_MODE=true
          else
            APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
            SIGNED_MODE=false
          fi
          cat > latest.json <<EOF
          {"version":"$VERSION","apk_url":"https://github.com/cleancore01/cleancore-manager/releases/latest/download/CleanCore-Business-Manager.apk","released_at":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","signed_update":$SIGNED_MODE}
          EOF
          cp "$APK_PATH" CleanCore-Business-Manager.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" CleanCore-Business-Manager.apk latest.json --clobber
          else
            gh release create "$TAG" CleanCore-Business-Manager.apk latest.json --title "CleanCore Business Manager $VERSION" --notes "CleanCore Manager $VERSION"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cleancore-business-manager-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -e 'const fs=require("fs");const s=fs.readFileSync("app.js","utf8");console.log(s.match(/MANAGER_VERSION="([^"]+)"/)[1])')
          TAG="v$VERSION"
          cat > latest.json <<EOF
          {"version":"$VERSION","apk_url":"https://github.com/cleancore01/cleancore-manager/releases/latest/download/CleanCore-Business-Manager.apk","released_at":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          EOF
          cp android/app/build/outputs/apk/debug/app-debug.apk CleanCore-Business-Manager.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" CleanCore-Business-Manager.apk latest.json --clobber
          else
            gh release create "$TAG" CleanCore-Business-Manager.apk latest.json --title "CleanCore Business Manager $VERSION" --notes "CleanCore Manager $VERSION"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cleancore-business-manager-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
