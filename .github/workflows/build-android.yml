name: Build CleanCore Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets for Capacitor
        run: |
          mkdir -p www
          cp index.html app.js app-*.js style.css logo.svg icon-*.svg manifest.webmanifest sw.js www/

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare app launcher icon
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -rf android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          npm install --no-save sharp
          node - <<'NODE'
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');
          const sizes = { mdpi: 48, hdpi: 72, xhdpi: 96, xxhdpi: 144, xxxhdpi: 192 };
          (async () => {
            for (const [density, size] of Object.entries(sizes)) {
              const dir = path.join('android/app/src/main/res', 'mipmap-' + density);
              fs.mkdirSync(dir, { recursive: true });
              await sharp('logo.svg').resize(size, size, {fit:'cover'}).png().toFile(path.join(dir, 'ic_launcher.png'));
              await sharp('logo.svg').resize(size, size, {fit:'cover'}).png().toFile(path.join(dir, 'ic_launcher_round.png'));
            }
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Set Android version
        run: |
          VERSION=$(node -e 'const fs=require("fs");const s=fs.readFileSync("app.js","utf8");console.log(s.match(/MANAGER_VERSION="([^"]+)"/)[1])')
          CODE=$(node -e 'const v=process.argv[1].split(".").map(Number);console.log(v[0]*10000+v[1]*100+v[2])' "$VERSION")
          python3 - "$VERSION" "$CODE" <<'PY'
          import sys,re
          version,code=sys.argv[1],sys.argv[2]
          p="android/app/build.gradle"
          s=open(p).read()
          s=re.sub(r'versionCode\s+\d+',f'versionCode {code}',s,count=1)
          s=re.sub(r'versionName\s+"[^"]+"',f'versionName "{version}"',s,count=1)
          open(p,"w").write(s)
          PY

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -e 'const fs=require("fs");const s=fs.readFileSync("app.js","utf8");console.log(s.match(/MANAGER_VERSION="([^"]+)"/)[1])')
          TAG="v$VERSION"
          cat > latest.json <<EOF
          {"version":"$VERSION","apk_url":"https://github.com/cleancore01/cleancore-manager/releases/latest/download/CleanCore-Business-Manager.apk","released_at":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" android/app/build/outputs/apk/debug/app-debug.apk#CleanCore-Business-Manager.apk latest.json#latest.json --clobber
          else
            gh release create "$TAG" android/app/build/outputs/apk/debug/app-debug.apk#CleanCore-Business-Manager.apk latest.json#latest.json --title "CleanCore Business Manager $VERSION" --notes "CleanCore Manager $VERSION"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cleancore-business-manager-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
